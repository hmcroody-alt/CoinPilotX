  - id: "api.shape"
    name: "How the PulseSoc API is shaped"
    description: "One Flask application (bot:app) carries 2,007 route registrations across 28 product areas. Optional route packs are registered inside try/except blocks so one broken feature cannot block boot — which means a subsystem can silently vanish in production. A 404 is therefore not automatically a routing bug; it may be a pack that failed to register."
    domain: "api"
    source: "UNDX_RECON/03_API_MAP.md §1, §2; UNDX_RECON/02_SYSTEM_KNOWLEDGE_MAP.md LAYER C"
    confidence: "high"
    status: "AVAILABLE"
    user_facing_explanation: "If a feature returns 'not found', it can mean the feature failed to load on the server rather than that you did something wrong."
  - id: "api.auth"
    name: "Authentication on API routes"
    description: "Routes are protected by session cookie or bearer token, applied through helper decorators plus application-wide before_request gates. Mobile clients hold a bearer token in secure storage and refresh it at POST /api/mobile/auth/refresh. A route appearing in the public/none bucket is not necessarily unauthenticated: some enforce auth inside the handler body."
    domain: "api"
    source: "UNDX_RECON/03_API_MAP.md §4"
    confidence: "high"
    status: "AVAILABLE"
    security_notes: "Do not tell a user a route is public on the basis of a decorator scan alone."
    user_facing_explanation: ""
  - id: "api.undx_surface_routes"
    name: "The UNDX API surfaces"
    description: "UNDX is reachable at /api/undx/chat (conversational, governed by R1), /api/pulse-ai/* (the agent path, the governed write path), /api/pulse-ai/tools/simulate (dry-run simulator, the one place R2 is authority), /api/business-os/{advertising,marketplace}/assistant/* (Business OS assistants), and /api/undx/kernel/* (repository execution kernel). These have different authority and must never be described with one global sentence."
    domain: "undx"
    source: "UNDX_RECON/11_AUTHORITY_RECONCILIATION.md §2"
    confidence: "high"
    status: "PARTIAL"
    user_facing_explanation: ""
