# Capability control-plane drift gate.
#
# Two kinds of drift, and only one of them can fail this job.
#
# STATIC CONTRACT DRIFT is a property of the commit under test: the inventory
# lost a key, a capability arrived without evidence, the migration started
# writing the frozen legacy column, a legacy word became parseable at runtime.
# Reproducible anywhere, caused by the change being tested, so it exits 1.
#
# PRODUCTION OBSERVED DRIFT is the stored feature_flags rows disagreeing with
# measured production. It is real and it is printed at full severity -- there
# are four findings on a healthy tree today, three of them CRITICAL -- but it
# does not fail the job. Two reasons:
#
#   * Nobody's pull request caused it. `marketplace_checkout` is seeded
#     `internal-only` while checkout has taken 32 real orders; failing every
#     unrelated PR until somebody edits a config row teaches people to bypass
#     the gate, and a bypassed gate still looks like coverage.
#   * A CI runner cannot reach production Postgres. The observed half reads
#     `services/pulse_control_plane/observations.py`, a recording dated
#     MEASURED_AT. Failing on it would be failing on the age of a file.
#
# The `--strict` mode, which does fail on observed drift, is for the Stage 23
# pre-activation check -- the one moment when observed drift *should* stop the
# process -- and is deliberately not run here.
#
# Exit code 3 means the gate could not run. It is not a pass, and this job must
# never gain `continue-on-error`.
#
# The detector opens no database and makes no network call. It is safe to run
# on a fork PR.

name: Capability drift

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: capability-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pytest and nothing else. The control-plane package and its tests import
      # only the standard library, which is what makes this job fast and makes
      # it impossible for the job to reach a database by accident. If this list
      # ever grows past pytest, something in the package acquired a dependency
      # and that is worth noticing rather than papering over with
      # `-r requirements.txt`.
      #
      # This step is not decoration: the job originally had no install at all,
      # on the reasoning that the package is pure stdlib. True of the package,
      # false of the runner — `python3 -m pytest` needs pytest to exist, so the
      # step below failed on arrival. Verified since against a venv containing
      # pytest alone.
      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: The gate can still fail
        # Before trusting a green gate, prove it is capable of going red.
        run: python3 -m pytest tests/pulse_control_plane/ -q -k "Drift or drift"

      # The step above selects `Drift or drift`, which is right for what it is
      # for -- a non-vacuity probe aimed at the detector. But it was also the
      # only pytest run in this job, so every other test in the directory was
      # *collected and then deselected*. Collection alone proves the modules
      # import; it proves nothing about the assertions, and the wave-1 suite
      # sat in that state through the whole wave, visible in the job log as a
      # deselected count that grew by 90 while the passing count did not move.
      #
      # Run separately rather than by widening the selector above, so that a
      # failure still says which of the two things broke.
      - name: Control-plane suite
        run: python3 -m pytest tests/pulse_control_plane/ -q

      # `.env.example` is not documentation. `test_environment_contract.py`
      # requires every `os.getenv` in the tree to appear in it, and it is what
      # an operator copies -- so a gate listed there that nothing reads is a
      # switch somebody will set during an incident and then believe. That is
      # the same lie as a dead Railway variable, caught one step earlier.
      #
      # The contract gate already enforces code -> file. This enforces file ->
      # code, and only for gate-shaped names. Together the two make the
      # declared gate surface and the real one the same set.
      #
      # Why this file and not production: the audit only exits non-zero with
      # `--env-file`, and a CI runner has no credential-free way to obtain a
      # production variable dump. Auditing the declared contract needs no
      # secret, so this stays safe on a fork PR -- the script opens no database
      # and makes no network call.
      #
      # Two things this does NOT do, so a green tick is not misread:
      #
      #   * It does not check production. Railway can still hold a dead
      #     variable this file never mentioned; that is issue #15's other half
      #     and needs a dump a human runs.
      #   * It does not see every dead declaration. `GATE_NAME` matches names
      #     that *look* like switches, and three of the eight removed to make
      #     this green -- `TRANSLATION_FAIL_OPEN`, `TRANSLATION_PRESERVE_ORIGINAL`,
      #     `TRANSLATION_SHOW_ORIGINAL_OPTION` -- do not match it. They were
      #     found by a human root-cause report, not by this gate, and nothing
      #     stops them coming back.
      - name: The operator contract declares no dead gate
        run: |
          code=0
          python3 scripts/control_plane_audit.py --env-file .env.example || code=$?
          if [ "$code" != "0" ]; then
            echo "::error::.env.example declares a gate that nothing in the tree reads. Remove the declaration, or wire the gate up."
          fi
          exit "$code"

      - name: Capability drift
        run: |
          code=0
          python3 scripts/capability_drift_gate.py || code=$?
          if [ "$code" = "3" ]; then
            echo "::error::The capability drift gate could not run. That is not a pass."
            exit 1
          fi
          exit "$code"
