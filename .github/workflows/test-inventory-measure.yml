# TEMPORARY measurement job for issue #28.
#
# 671 of 733 test files are executed by no workflow. Before any of them can be
# turned on, we need to know which ones pass standalone -- turning them all on
# at once produces a gate that is red on arrival, and a gate that is red on
# arrival gets disabled rather than fixed.
#
# This job produces that list. It is NOT a gate: it always exits 0. Its only
# output is a machine-readable TSV in the log, which is then baked into the
# real workflow.
#
# It has to run HERE rather than on a developer's machine because the answer is
# interpreter-dependent and local interpreters are not production's. That is
# issue #29: .python-version had drifted to 3.13.13 while CI and Railway both
# ran 3.11, and they straddle 3.12, where slice objects became hashable. A
# protection test pinned the exception type the local interpreter raised,
# passed every local run, and turned CI red. Measuring "which tests pass" on
# the wrong side of that boundary would bake the same mistake into a list of
# several hundred files instead of one assertion.
#
# DELETE THIS FILE once the list it produces is committed.

name: Test execution inventory (measurement only)

on:
  workflow_dispatch:
  push:
    branches:
      - ci-test-execution-inventory

permissions:
  contents: read

jobs:
  measure:
    name: Inventory shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest

      # One process per file, deliberately. Three directories
      # (crypto_premium, marketplace, dropshipping) each set their own temp
      # DATABASE_URL at import time, so batching two files produces failures
      # neither produces alone. crypto-alert-persistence.yml already works
      # around this with a per-suite loop; this is the same shape.
      - name: Measure
        shell: bash
        run: |
          # `shell: bash` runs `bash -eo pipefail`, so WITHOUT this the first
          # failing test file aborts the shard -- which is fatal for a job whose
          # entire purpose is to record which files fail.
          set +e
          i=0
          while IFS= read -r f; do
            if [ $(( i % 8 )) -eq ${{ matrix.shard }} ]; then
              out=$(timeout 300 python -m pytest "$f" -q -p no:cacheprovider 2>&1)
              rc=$?
              verdict=$(printf '%s' "$out" | grep -oE '[0-9]+ (passed|failed|error|errors|skipped)[^|]*' | tail -1)
              [ -z "$verdict" ] && verdict=$(printf '%s' "$out" | tail -2 | tr '\n' ' ' | cut -c1-180)
              printf 'INVENTORY|%s|%s|%s\n' "$f" "$rc" "$verdict"
            fi
            i=$(( i + 1 ))
          done < <(find tests -name 'test_*.py' -type f | sort)
          echo "INVENTORY_SHARD_COMPLETE ${{ matrix.shard }}"
          exit 0
