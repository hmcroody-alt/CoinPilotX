# ---------------------------------------------------------------------------
# Safety and adversarial input
# ---------------------------------------------------------------------------

  - id: neuralchemy/Prompt-injection-dataset
    domain: safety
    downloads: 2085
    license: apache-2.0
    gated: false
    decision: SAFETY_TEST_ONLY
    rationale: >-
      The highest-value external artifact identified by this mission. UNDX ingests
      repository text through services/undx_brain/corpus.py, which scans for
      injection shapes at ingest via `_injection_shaped` and wraps records in a data
      envelope. That scanner has never been tested against a corpus of real injection
      attempts written by people trying to break something. Replaying these against
      `_injection_shaped` measures a guard that currently has only its author's
      imagination behind it.
    canonical_authority: NON_CANONICAL
    handling: >-
      Never ingested as knowledge. Loaded by a test, passed to the scanner, asserted
      on. A corpus of attacks stored where the corpus loader can see it would be the
      attack.

  - id: 3nesdeniz/agentic-prompt-injection-boundary-pairs
    domain: safety
    downloads: 687
    license: cc-by-4.0
    gated: false
    decision: SAFETY_TEST_ONLY
    rationale: >-
      Paired benign/malicious inputs, which is the shape that measures false
      positives as well as misses. A scanner that rejects everything scores perfectly
      against attacks alone; the benign half is what makes the number mean something.
    canonical_authority: NON_CANONICAL

  - id: Lakera/mosscap_prompt_injection
    domain: safety
    downloads: 877
    license: mit
    gated: false
    decision: SAFETY_TEST_ONLY
    rationale: >-
      Attempts harvested from a public prompt-injection game, so the distribution is
      real adversarial effort rather than synthesised examples of what an author
      expected an attacker to try.
    canonical_authority: NON_CANONICAL

  - id: xTRam1/safe-guard-prompt-injection
    domain: safety
    downloads: 1429
    license: NONE
    gated: false
    decision: OWNER_REVIEW_REQUIRED
    rationale: No licence tag.
    canonical_authority: NON_CANONICAL

  - id: rogue-security/prompt-injections-benchmark
    domain: safety
    downloads: 933
    license: cc-by-nc-4.0
    gated: true
    decision: REJECT
    rationale: >-
      Gated and NonCommercial. Both bar it independently; the agreement was not
      accepted.
    canonical_authority: NON_CANONICAL

  - id: facebook/cyberseceval3-visual-prompt-injection
