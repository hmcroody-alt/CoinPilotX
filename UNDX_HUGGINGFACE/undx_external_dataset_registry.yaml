# ---------------------------------------------------------------------------
# Models — where the measured gap actually points
# ---------------------------------------------------------------------------
#
# Recorded but NOT adopted. Every entry here would require a model runtime this
# repository does not have, and adding one to a Flask monolith that boots optional
# route packs inside `except Exception` blocks is an architecture decision, not a
# mission task. They are listed so the option is documented with real candidates
# rather than described in the abstract.

models:
  - id: sentence-transformers/all-MiniLM-L6-v2-class
    note: >-
      The MiniLM sentence-embedding family is the obvious candidate for the routing
      gap: encode the 451 declared intent phrases once, encode the incoming message,
      route on cosine similarity above a threshold and fall back to the existing
      subsequence matcher below it. That is additive — `match_capability` keeps its
      current behaviour as the floor — which matters because the authorization,
      confirmation and audit layers all sit downstream of routing and none of them
      would change.
    decision: NOT_ADOPTED
    blocker: >-
      Requires sentence-transformers plus a ~90MB weight file in the web dyno, or a
      separate inference service. Both are deployment changes for the owner to weigh.

  - id: cross-encoder/ettin-reranker-68m-v1
    downloads: 16286
    license: apache-2.0
    note: >-
      A reranker would only matter after a retrieval layer exists that returns more
      than one candidate. `match_capability` returns exactly one capability and no
      indication of closeness — asserted in tests/undx_brain/test_selection.py — so
      there is nothing to rerank today.
    decision: NOT_ADOPTED
    blocker: No candidate list exists to rerank.

  - id: cross-encoder-testing/reranker-bert-tiny-gooaq-bce
    downloads: 271410
    license: apache-2.0
    note: Highest-adoption reranker found. Same blocker.
    decision: NOT_ADOPTED
    blocker: No candidate list exists to rerank.
