# UNDX external dataset registry
#
# Every Hugging Face artifact evaluated for the corpus expansion mission, with the
# decision taken on it and the reason. Written to be read by a person deciding whether
# to acquire something, not by a downloader: nothing here has been fetched.
#
# Two facts constrain every decision below and are stated once rather than repeated
# per entry.
#
#   1. There is no training substrate in this repository. `torch`, `transformers`,
#      `peft`, `Trainer` and `TrainingArguments` appear nowhere in services/, scripts/
#      or the root modules. The only match for "torch" is `advanced:[{torch:true}]` at
#      bot.py:51377, a camera-flashlight constraint in inline JavaScript. `undx_router`
#      calls OpenAI, Claude, Gemini, DeepSeek and Groq over HTTP. There are no weights
#      here to fine-tune, so FINE_TUNE and DISTILL are not decisions this repository
#      can currently take, and no entry claims them.
#
#   2. The measured gap is not a knowledge gap. `scripts/undx_routing_generalisation.py`
#      reports that UNDX routes blind paraphrases at 1.9% and held-out controls at 0%,
#      because `match_capability` matches words in order and nothing else. No corpus of
#      instruction text repairs that; a semantic similarity layer does. That moves the
#      relevant Hugging Face artifact class from *datasets* to *sentence-embedding
#      models*, which is recorded under `models:` below.
#
# Discovery method: the sandbox cannot reach huggingface.co (HTTP 403 from the egress
# proxy, for both huggingface.co and datasets-server.huggingface.co), so listings were
# read through the authenticated browser session against /api/datasets and /api/models,
# sorted by downloads. Download counts and licences are as reported by that API on
# 2026-08-29. Licence strings come from each repo's `license:` tag; a tag is not a
# licence review, and `OWNER_REVIEW_REQUIRED` below means exactly that.

meta:
  mission: UNDX Hugging Face Intelligence Corpus Expansion
  recorded: 2026-08-29
  discovery_channel: authenticated browser session, huggingface.co public API
  sandbox_reachability: blocked (403 at egress proxy)
  artifacts_downloaded: 0
  token_handled: false        # no HF token was read, printed, stored or transmitted
  gated_agreements_accepted: 0

# Decisions used. FINE_TUNE and DISTILL are defined for completeness and are
# unavailable here for the reason in note 1 above.
decisions:
  RAG: content may be ingested into services/undx_brain/corpus.py as NON-CANONICAL
    external knowledge, injection-scanned at ingest and wrapped in a data envelope.
  EVALUATION_ONLY: used to measure UNDX, never to teach it. Nothing from the file
    reaches a prompt as instruction.
  SAFETY_TEST_ONLY: adversarial inputs, replayed against the guard path to see whether
    it holds. Never ingested.
  REJECT: not acquired.
  OWNER_REVIEW_REQUIRED: blocked pending a human licence decision. No UNKNOWN-licence
    artifact goes into production.

# ---------------------------------------------------------------------------
# Tool use and function calling
# ---------------------------------------------------------------------------
datasets:

  - id: gorilla-llm/Berkeley-Function-Calling-Leaderboard
    domain: tool_use
    downloads: 151963
    license: apache-2.0
    gated: false
    decision: EVALUATION_ONLY
    rationale: >-
      The strongest tool-use benchmark on the hub by adoption, and permissively
      licensed. Its value here is as a yardstick for whether UNDX's argument
      resolution holds up against a standard, not as material. Its schemas are
      generic function signatures; PulseSoc's are a closed registry of 120
      capabilities with owner-scoped authorization, so its cases cannot be replayed
      against the real gateway without inventing capabilities that do not exist.
    canonical_authority: NON_CANONICAL

  - id: NousResearch/hermes-function-calling-v1
    domain: tool_use
    downloads: 60807
    license: apache-2.0
    gated: false
    decision: REJECT
    rationale: >-
      A fine-tuning corpus for teaching a base model to emit tool calls. With no
      training substrate it would be a file nobody imports — the precedent named in
      the docstring of services/undx_brain/corpus.py, where the v6 corpus was
      generated, audited, committed, and imported by nothing.
    canonical_authority: NON_CANONICAL

  - id: glaiveai/glaive-function-calling-v2
    domain: tool_use
    downloads: 59029
    license: apache-2.0
    gated: false
    decision: REJECT
    rationale: Same as hermes-function-calling-v1. SFT material with no consumer.
    canonical_authority: NON_CANONICAL

  - id: Salesforce/xlam-function-calling-60k
    domain: tool_use
    downloads: 30964
    license: cc-by-4.0
    gated: true
    decision: OWNER_REVIEW_REQUIRED
    rationale: >-
      Gated behind an agreement that a person must accept in their own account. The
      mission forbids bypassing gated agreements and this entry exists to record that
      it was not bypassed. Moot in any case while decision would be REJECT for the
      same reason as the two above.
    canonical_authority: NON_CANONICAL

  - id: lockon/xlam-function-calling-60k
