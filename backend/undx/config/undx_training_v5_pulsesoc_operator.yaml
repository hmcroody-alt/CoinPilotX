# UNDX TRAINING SPECIFICATION
# Version: 5.0.0
# Codename: PULSESOC OPERATOR
#
# Purpose:
#   Train and configure UNDX to help users operate PulseSOC through natural
#   language. V5 focuses on two major capability families:
#
#   1. ACTIONS
#      Change settings, manage notifications, control conversations, prepare
#      and publish content, manage alerts, and perform other authorized tasks.
#
#   2. DISCOVERY
#      Search PulseSOC posts, videos, Reels, creators, music, conversations,
#      alerts, and user-owned content using semantic and structured search.
#
# This is not a model-training dataset by itself. It is a server-side
# implementation, policy, action-registry, search-registry, evaluation, and QA
# specification that must be connected to the live UNDX inference pipeline.
#
# Primary QA environments:
#   - Physical iPhone 16 Pro
#   - Xcode iPhone 16 Pro Simulator
#
# The physical iPhone must receive the latest signed build throughout
# development. Simulator-only PASS is prohibited.

schema_version: "5.0"
system_name: "UNDX"
codename: "PULSESOC OPERATOR"
product: "PulseSOC"
architecture_class: "governed_action_and_discovery_intelligence"
configuration_mode: "server_side_dynamic_context_and_tool_compilation"

heritage:
  extends:
    - "UNDX v1 Foundation"
    - "UNDX v2 ORBITAL MIND"
    - "UNDX v3 SOVEREIGN MIND"
    - "UNDX v4 NEXUS CORE"
    - "UNDX COMMAND CORE Action Layer"
  v5_focus:
    - "Natural-language control of PulseSOC."
    - "Semantic search across PulseSOC content."
    - "Structured search filters."
    - "Verified user-authorized actions."
    - "Native result cards and confirmation cards."
  migration:
    - preserve_canonical_user_ids
    - preserve_canonical_conversation_ids
    - preserve_canonical_message_ids
    - preserve_canonical_post_ids
    - preserve_canonical_reel_ids
    - preserve_canonical_media_ids
    - preserve_existing_authentication
    - preserve_existing_permissions
    - preserve_existing_search_indexes
    - preserve_existing_notification_settings
    - preserve_native_and_WebView_history
  prohibitions:
    - no_second_AI_backend
    - no_second_search_backend
    - no_second_notification_system
    - no_duplicate_content_records
    - no_client_side_authorization
    - no_fake_tool_success
    - no_full_yaml_in_every_prompt

identity:
  canonical_name: "UNDX"
  role: "PulseSOC intelligence companion and operating assistant"
  required_statement: >
    I am UNDX, PulseSOC's intelligence companion. I can help users discover
    PulseSOC content and safely operate supported PulseSOC features.
  invariants:
    - "UNDX always identifies as UNDX."
    - "UNDX never claims an unavailable capability."
    - "UNDX never claims an action succeeded without verification."
    - "UNDX never adopts a different assistant identity."

mission:
  objective: >
    Let users control and search PulseSOC through ordinary conversation while
    preserving authorization, privacy, canonical backend state, confirmation,
    idempotency, relevance, and truthful reporting.
  example_requests:
    actions:
      - "Turn on notifications for messages."
      - "Stop notifying me about posts."
      - "Mute calls for tonight."
      - "Make my account private."
      - "Mute this conversation for eight hours."
      - "Mark my alerts as read."
      - "Create a Bitcoin price alert at 90,000."
      - "Draft a post about financial freedom."
      - "Publish the post after I approve it."
    discovery:
      - "Find me PulseSOC posts about love."
      - "Show me videos about money."
      - "Find Reels about crypto."
      - "Search for posts about relationships from this week."
      - "Show me trending Bitcoin content."
      - "Find videos I saved about investing."
      - "Find the Reel where someone talked about passive income."
      - "Show me posts from creators I follow about love."

core_operating_principles:
  - user_control_before_autonomy
  - verified_state_before_success_claim
  - production_backend_before_model_assumption
  - canonical_ID_before_display_name
  - privacy_before_personalization
  - least_privilege_before_broad_access
  - search_relevance_before_result_volume
  - current_state_before_cached_state
  - explicit_uncertainty_before_invention
  - physical_device_evidence_before_device_PASS

runtime_pipeline:
  action_request:
    - receive_request
    - classify_action_intent
    - bind_authenticated_user
    - resolve_current_UI_context
    - select_registered_action
    - extract_and_validate_arguments
    - read_current_state
    - authorize
    - determine_confirmation
    - execute_with_idempotency
    - verify_authoritative_state
    - refresh_native_state
    - persist_audit
    - report_verified_result
  search_request:
    - receive_request
    - classify_search_intent
    - bind_authenticated_user
    - parse_topic_and_filters
    - determine_search_scope
    - enforce_visibility_and_privacy
    - run_hybrid_search
    - rank_and_diversify
    - hydrate_canonical_results
    - generate_native_result_cards
    - preserve_search_session
    - answer_with_grounded_summary

capability_families:
  actions:
    - notification_management
    - profile_management
    - privacy_management
    - conversation_management
    - messaging
    - posts
    - reels
    - saved_content
    - social_relationships
    - alerts
    - crypto_alerts
    - calls
    - creator_preferences
    - security
  discovery:
    - posts_search
    - reels_search
    - videos_search
    - creators_search
    - music_search
    - conversations_search
    - messages_search
    - alerts_search
    - user_library_search
    - semantic_topic_search
    - trending_search
    - saved_content_search

action_policy:
  action_classes:
    read:
      confirmation: false
    prepare:
      confirmation: false
    reversible_setting:
      confirmation: true
    communication:
      confirmation: true
    publishing:
      confirmation: true
    destructive:
      confirmation: "typed"
    security_critical:
      confirmation: "typed_and_fresh_auth"
  success_contract:
    required:
      - execute_tool_success
      - verification_tool_success
      - canonical_state_matches_request
    prohibited:
      - success_from_client_optimism
      - success_from_model_assumption
      - success_from_unverified_202_response
  no_op_behavior:
    rule: >
      If the authoritative state already matches the request, do not create a
      redundant write. Tell the user that the requested setting is already in
      the desired state.

authentication_and_authorization:
  actor_source: "authenticated_server_session"
  model_generated_user_id_allowed: false
  checks:
    - valid_session
    - account_active
    - action_permission
    - target_permission
    - privacy_permission
    - moderation_permission
    - fresh_auth_when_required
  account_isolation:
    - clear_pending_actions_on_logout
    - clear_pending_actions_on_account_switch
    - clear_user_scoped_search_session
    - clear_private_cached_results
    - revoke_previous_user_tool_context

confirmation_service:
  token_fields:
    - confirmation_id
    - authenticated_user_id
    - action_id
    - action_version
    - target_id
    - argument_hash
    - current_state_hash
    - expires_at
  expiration_seconds:
    simple: 300
    explicit: 300
    typed: 180
  invalidation:
    - logout
    - account_switch
    - target_changed
    - state_changed
    - arguments_changed
    - permission_changed
    - token_expired
  language:
    enable_setting: "Turn on {setting_name}?"
    disable_setting: "Turn off {setting_name}?"
    publish: "Publish this {content_type} to your PulseSOC audience?"
    destructive: "This action cannot be easily reversed. Confirm {action_name}."

idempotency:
  required_for_all_writes: true
  key_components:
    - authenticated_user_id
    - action_id
    - action_version
    - canonical_target_id
    - normalized_argument_hash
    - client_request_id
  duplicate_handling:
    completed: return_original_verified_result
    in_progress: return_in_progress
    uncertain: verify_before_retry
    payload_conflict: reject

notification_management:
  production_requirement: "Reuse the existing PulseSOC notification preference service."
  shared:
    read_tool: "get_notification_preferences"
    write_tool: "update_notification_preferences"
    verify_tool: "get_notification_preferences"
    authorization: "authenticated_self"
    risk: "reversible_setting"
    confirmation: true
  categories:
    messages:
      enable_action: "notifications.messages.enable"
      disable_action: "notifications.messages.disable"
      natural_language:
        - "Turn on message notifications."
        - "Notify me when someone messages me."
        - "Stop message notifications."
        - "Mute message alerts."
    posts:
      enable_action: "notifications.posts.enable"
      disable_action: "notifications.posts.disable"
      natural_language:
        - "Turn on post notifications."
        - "Notify me about new posts."
        - "Stop post alerts."
    calls:
      enable_action: "notifications.calls.enable"
      disable_action: "notifications.calls.disable"
      natural_language:
        - "Turn on call notifications."
        - "Notify me when someone calls."
        - "Turn off call alerts."
    reels:
      enable_action: "notifications.reels.enable"
      disable_action: "notifications.reels.disable"
      natural_language:
        - "Turn on Reel notifications."
        - "Stop Reel alerts."
    live:
      enable_action: "notifications.live.enable"
      disable_action: "notifications.live.disable"
    follows:
      enable_action: "notifications.follows.enable"
      disable_action: "notifications.follows.disable"
    comments:
      enable_action: "notifications.comments.enable"
      disable_action: "notifications.comments.disable"
    reactions:
      enable_action: "notifications.reactions.enable"
      disable_action: "notifications.reactions.disable"
    mentions:
      enable_action: "notifications.mentions.enable"
      disable_action: "notifications.mentions.disable"
    crypto:
      enable_action: "notifications.crypto.enable"
      disable_action: "notifications.crypto.disable"
  temporal_controls:
    actions:
      - notifications.category.mute_until
      - notifications.all.quiet_hours.set
      - notifications.all.quiet_hours.clear
    examples:
      - "Mute call notifications until 8 AM."
      - "Silence all notifications tonight."
      - "Turn message alerts back on tomorrow morning."
    requirements:
      - timezone_resolution
      - exact_end_time_confirmation
      - server_scheduled_restore
      - restore_verification
  native_refresh:
    event: "notification_preferences_updated"
    requirements:
      - refresh_settings_screen
      - update_badge_behavior
      - preserve_OS_permission_distinction
  OS_permission_boundary:
    rule: >
      Distinguish PulseSOC in-app notification preferences from iOS system
      notification authorization. UNDX may update PulseSOC preferences through
      backend tools. Changing iOS notification permission may require opening
      the system Settings app and cannot be falsely reported as completed.
    supported_actions:
      - read_iOS_notification_authorization
      - open_iOS_app_notification_settings
    prohibited_claim:
      - "UNDX directly changed iOS permission when iOS requires user interaction."

search_intelligence:
  objective: >
    Search PulseSOC content by meaning, keywords, content type, creator,
    recency, popularity, relationship, ownership, and engagement while
    respecting visibility, blocks, moderation, and account permissions.
  query_understanding:
    extract:
      - topic
      - content_types
      - keywords
      - semantic_concepts
      - creator
      - relationship_scope
      - time_range
      - language
      - sort_order
      - ownership_scope
      - saved_scope
      - watched_scope
      - engagement_filter
      - media_filter
    examples:
      love:
        semantic_expansion:
          - love
          - romance
          - relationship
          - affection
          - dating
          - heartbreak
          - marriage
          - emotional_connection
      money:
        semantic_expansion:
          - money
          - finance
          - wealth
          - budgeting
          - income
          - investing
          - financial_freedom
          - passive_income
      crypto:
        semantic_expansion:
          - cryptocurrency
          - Bitcoin
          - Ethereum
          - blockchain
          - altcoins
          - DeFi
          - wallets
          - market_analysis
  search_modes:
    exact:
      use_for:
        - hashtags
        - usernames
        - quoted_phrases
        - canonical_titles
    semantic:
      use_for:
        - concepts
        - themes
        - remembered_descriptions
    hybrid:
      default: true
      combines:
        - lexical
        - semantic
        - metadata
        - graph
        - temporal
    personalized:
      use_for:
        - followed_creators
        - saved_content
        - prior_explicit_preferences
      prohibited:
        - sensitive_attribute_inference
        - cross_user_history
  privacy_filters:
    apply_before_ranking: true
    checks:
      - content_visibility
      - blocked_relationship
      - account_status
      - moderation_status
      - age_or_eligibility_restrictions
      - regional_availability
      - user_specific_access
  moderation:
    excluded_by_default:
      - removed_content
      - quarantined_content
      - policy_blocked_content
      - deleted_content
  ranking:
    signals:
      semantic_relevance: 0.34
      lexical_relevance: 0.18
      freshness: 0.12
      engagement_quality: 0.10
      relationship_relevance: 0.08
      creator_authority: 0.06
      watch_or_save_affinity: 0.06
      diversity: 0.06
    anti_abuse:
      - engagement_fraud_discount
      - duplicate_content_collapse
      - spam_penalty
      - keyword_stuffing_penalty
      - unsafe_content_filter
    diversity:
      requirements:
        - creator_diversity
        - format_diversity
        - topic_subtheme_diversity
      maximum_results_per_creator_default: 3
  freshness:
    presets:
      today: "last_24_hours"
      this_week: "last_7_days"
      this_month: "last_30_days"
      recent: "last_14_days"
      all_time: "unbounded"
  result_hydration:
    required_fields:
      - canonical_content_id
      - content_type
      - creator_id
      - creator_display
      - preview_text
      - thumbnail_or_media_reference
      - created_at
      - visibility
      - engagement_summary
      - deep_link
    optional_fields:
      - duration
      - music_track
      - hashtags
      - relevance_reason
      - saved_status
      - followed_creator_status

