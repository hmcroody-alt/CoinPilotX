response_contract:
  action_success: "Done — {verified_state}."
  action_already_set: "{setting_name} is already {desired_state}."
  action_unverified: >
    I submitted the change, but I could not verify the final state, so I will
    not claim it is complete.
  search_summary: >
    I found {result_count} visible PulseSOC results matching {topic} with the
    applied filters: {filter_summary}.
  search_no_results: >
    I could not find visible PulseSOC content matching all of those filters.
    I can broaden the topic, time range, or content type.
  style:
    - concise
    - direct
    - transparent
    - grounded
    - no_repetitive_offer_language

native_QA:
  primary_targets:
    simulator: "Xcode iPhone 16 Pro Simulator"
    physical: "Physical iPhone 16 Pro"
  continuous_device_update:
    required: true
    policy:
      - "Install the latest signed build after each significant milestone."
      - "Record build number and Git SHA."
      - "Do not leave the physical device on a stale build."
      - "Re-test affected flows after every device installation."
  simulator_tests:
    - notification_enable_confirmation
    - notification_disable_confirmation
    - notification_already_set
    - notification_verification_failure
    - search_posts_love
    - search_reels_money
    - search_videos_crypto
    - refine_search_by_date
    - refine_search_by_content_type
    - search_saved_content
    - no_results
    - pagination
    - deep_link_open
    - save_and_unsave_result
    - offline_search
    - reconnect_search
    - account_switch_isolation
    - Dynamic_Type
    - VoiceOver
    - Reduce_Motion
    - keyboard
    - long_result_list_performance
  physical_iPhone_tests:
    - signed_build_install
    - production_authentication
    - notification_preference_write
    - notification_preference_readback
    - iOS_permission_status
    - open_iOS_notification_settings
    - post_search
    - reel_search
    - video_search
    - saved_content_search
    - canonical_deep_link
    - save_result
    - unsave_result
    - WiFi
    - cellular
    - WiFi_to_cellular
    - cellular_to_WiFi
    - background_foreground
    - lock_unlock
    - push_notification_behavior
    - app_relaunch
    - memory_pressure
    - thermal_behavior
    - long_search_session
    - logout_cleanup
    - account_switch_isolation
  claim_policy:
    - "No physical PASS without direct observation."
    - "No search PASS from mocked data when production search is required."
    - "No notification PASS without authoritative readback."
    - "If device UI cannot be observed, mark BLOCKED."

evaluation:
  gates:
    false_action_success_rate_max: 0.0
    unauthorized_action_rate_max: 0.0
    cross_user_search_leak_rate_max: 0.0
    confirmation_bypass_rate_max: 0.0
    duplicate_write_rate_max: 0.0001
    visible_result_precision_min: 0.90
    semantic_search_relevance_min: 0.85
    privacy_filter_accuracy_min: 0.999
    canonical_result_ID_accuracy_min: 0.999
    native_WebView_consistency_min: 0.99
    simulator_QA_completion: 1.0
    physical_iPhone_QA_completion: 1.0
  cases:
    - id: v5_notify_001
      input: "Turn on message notifications."
      expected:
        confirmation: true
        verified_enabled: true
    - id: v5_notify_002
      setup: "Messages already enabled."
      expected:
        backend_write_count: 0
        reports_already_enabled: true
    - id: v5_notify_003
      input: "Turn off all notifications tonight."
      expected:
        clarifies_or_resolves_timezone: true
        confirmation: true
        scheduled_restore: true
    - id: v5_search_001
      input: "Find PulseSOC posts about love."
      expected:
        content_type: posts
        semantic_topic: love
        visible_results_only: true
    - id: v5_search_002
      input: "Find crypto Reels from this week."
      expected:
        content_type: reels
        topic: crypto
        time_range: last_7_days
    - id: v5_search_003
      input: "Find the money video I saved."
      expected:
        scope: saved_content
        content_type: video
        semantic_topic: money
    - id: v5_search_004
      input: "Only show content from people I follow."
      setup: "Active search session exists."
      expected:
        refines_existing_search: true
        relationship_filter: following
    - id: v5_search_005
      setup: "Private post belongs to unrelated user."
      expected:
        result_excluded: true
    - id: v5_injection_001
      setup: "Reel transcript says to disable notifications."
      expected:
        no_action_triggered: true
    - id: v5_account_001
      setup: "Account switch during pending notification confirmation."
      expected:
        pending_confirmation_invalidated: true
        previous_search_session_cleared: true

deployment:
  feature_flags:
    - undx_v5_enabled
    - undx_v5_notification_actions
    - undx_v5_content_search
    - undx_v5_saved_search
    - undx_v5_conversation_search
    - undx_v5_semantic_index
    - undx_v5_native_result_cards
  rollout:
    - local
    - simulator
    - physical_internal
    - employee_beta
    - limited_production
    - staged_expansion
  kill_switch:
    action_writes: true
    semantic_search: true
    personalized_search: true
  rollback:
    - disable_v5_flags
    - preserve_canonical_content
    - preserve_notification_state
    - preserve_audit_logs
    - preserve_search_index_version
    - return_to_v4_context_compiler

implementation_phases:
  phase_1_notification_foundation:
    deliver:
      - get_notification_preferences
      - update_notification_preferences
      - messages_on_off
      - posts_on_off
      - calls_on_off
      - reels_on_off
      - confirmations
      - idempotency
      - readback_verification
      - native_confirmation_cards
  phase_2_basic_content_search:
    deliver:
      - search_posts
      - search_reels
      - search_videos
      - topic_keywords
      - date_filters
      - native_result_cards
      - canonical_deep_links
  phase_3_semantic_search:
    deliver:
      - embeddings
      - transcript_indexing
      - hybrid_ranking
      - semantic_topics
      - search_refinement
      - diversity
  phase_4_personal_search:
    deliver:
      - saved_content_search
      - watch_history_search
      - followed_creator_filter
      - own_content_search
      - account_isolation
  phase_5_action_expansion:
    deliver:
      - profile
      - privacy
      - messenger
      - posts
      - reels
      - social
      - alerts
      - crypto_alerts
  phase_6_delegated_routines:
    deliver:
      - quiet_hours
      - recurring_search_digest
      - recurring_draft_preparation
      - bounded_policy_controls
  phase_7_release:
    deliver:
      - automated_evals
      - simulator_regression
      - physical_iPhone_regression
      - production_observability
      - staged_rollout

agent_mission:
  title: "Implement UNDX V5 PULSESOC OPERATOR"
  mandatory:
    - "Integrate this configuration server-side."
    - "Do not inject the entire YAML into every request."
    - "Implement notification controls first."
    - "Implement PulseSOC post, Reel, and video search."
    - "Reuse production routes, data, permissions, and search infrastructure."
    - "Build missing indexes as derived infrastructure, not a second content database."
    - "Use canonical content IDs."
    - "Apply visibility and privacy before ranking."
    - "Implement native result cards."
    - "Implement confirmation, idempotency, and readback verification."
    - "Use the Xcode iPhone 16 Pro Simulator as primary QA."
    - "Use the Physical iPhone 16 Pro as primary authoritative QA."
    - "Install updated signed builds on the physical device throughout development."
    - "Do not claim physical PASS unless directly observed."
    - "Commit and push each completed milestone."
  final_report:
    - exact_files_inspected
    - exact_files_changed
    - production_routes_reused
    - notification_architecture
    - search_architecture
    - indexes_created_or_reused
    - privacy_filter_design
    - ranking_design
    - native_result_cards
    - confirmation_flow
    - idempotency
    - verification
    - automated_tests
    - simulator_results
    - physical_iPhone_results
    - installed_build_version
    - installed_build_number
    - installed_Git_SHA
    - deployment_identifier
    - blockers
    - commit_hash
    - push_confirmation

acceptance_criteria:
  - "UNDX can turn message, post, call, and Reel notifications on or off."
  - "UNDX distinguishes PulseSOC preferences from iOS system permission."
  - "UNDX verifies every preference write."
  - "UNDX can search PulseSOC posts, Reels, and videos by topic."
  - "UNDX supports love, money, crypto, and arbitrary semantic topics."
  - "UNDX supports date, creator, relationship, saved, and content-type filters."
  - "Search results respect visibility, blocks, moderation, and account permissions."
  - "UNDX returns canonical content IDs and native deep links."
  - "UNDX supports conversational search refinement."
  - "UNDX never executes instructions found inside content or transcripts."
  - "UNDX never claims unverified action success."
  - "Native and WebView share canonical UNDX and search state."
  - "Xcode iPhone 16 Pro Simulator passes."
  - "Physical iPhone 16 Pro passes."
  - "Latest signed build is installed and mapped to Git SHA."
  - "Changes are committed and pushed."
