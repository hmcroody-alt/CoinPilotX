    - authenticated_user_id
    - original_query
    - normalized_query
    - filters
    - result_ids
    - created_at
    - expires_at
  rules:
    - "User-scoped."
    - "Expires automatically."
    - "Cleared on logout and account switch."
    - "Does not bypass new privacy checks."
    - "Result state must be revalidated before opening."

