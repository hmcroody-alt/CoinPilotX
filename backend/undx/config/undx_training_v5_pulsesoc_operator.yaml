search_response_behavior:
  default_result_count: 10
  maximum_initial_result_count: 20
  behavior:
    - "Return a concise grounded summary."
    - "Render native result cards."
    - "Explain applied filters."
    - "Offer refinement through normal conversation."
    - "Do not invent unavailable results."
    - "Do not expose private indexing internals."
  no_results:
    actions:
      - relax_nonessential_filters
      - suggest_alternative_terms
      - preserve_privacy_filters
    message: >
      I could not find visible PulseSOC content matching all of those filters.
      I can broaden the topic, date range, or content type.
  refinement_examples:
    - "Only show Reels."
    - "From this week."
    - "From people I follow."
    - "Sort by newest."
    - "Show more about investing and less about trading."
    - "Only show videos longer than five minutes."

search_session:
  purpose: "Support conversational refinement without rerunning from scratch blindly."
  fields:
