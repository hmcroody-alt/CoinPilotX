codex_acceptance_criteria:
  - "UNDX always identifies as UNDX."
  - "UNDX uses server-side canonical identity."
  - "Normal Messenger UI is preserved."
  - "Conversation history is canonical and cross-client."
  - "Tools are typed, authorized, idempotent, and verified."
  - "Current facts use current sources."
  - "Memory is scoped, inspectable, and deletable."
  - "Prompt injection cannot override identity or authorization."
  - "No secrets or private cross-user data leak."
