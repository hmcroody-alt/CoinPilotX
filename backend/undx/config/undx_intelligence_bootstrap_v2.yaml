codex_implementation_mission:
  title: "Integrate UNDX Intelligence Bootstrap Pack v2"
  mandatory_rules:
    - "Do not replace existing canonical UNDX conversations."
    - "Do not create a second AI backend."
    - "Do not paste the full YAML into every model request."
    - "Implement a server-side context compiler."
    - "Keep identity and tool permissions server-authoritative."
    - "Add task graph persistence for long-running missions."
    - "Add typed tool registry and idempotency enforcement."
    - "Add verifier and red-team stages for high-risk tasks."
    - "Add evals for every case in evals_v2."
    - "Preserve v1 compatibility during staged rollout."
  Xcode_simulator_QA:
    device: "iPhone 16 Pro simulator"
    required_tests:
      - normal_chat_UI
      - streaming
      - cancellation
      - retry
      - markdown
      - code_blocks
      - attachments
      - offline_reconnect
      - account_switch
