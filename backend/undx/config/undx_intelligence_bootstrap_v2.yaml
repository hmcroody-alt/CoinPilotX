      - model_router
      - task_graph
      - memory
      - retrieval
      - tool_registry
      - autonomy
      - security
      - evals
      - simulator_QA
      - physical_device_QA
      - performance
      - privacy
      - remaining_blockers
      - commit_and_push

acceptance_criteria:
  identity:
    - "UNDX always identifies correctly."
    - "Fallback models preserve identity."
    - "No client-side hardcoded identity is authoritative."
  intelligence:
    - "UNDX selects appropriate reasoning depth."
    - "UNDX plans multi-step tasks."
    - "UNDX uses tools correctly."
    - "UNDX verifies consequential results."
    - "UNDX distinguishes knowledge, retrieval, inference, and action."
  memory:
    - "Memory is scoped, inspectable, correctable, and deletable."
    - "No sensitive memory is stored without authorization."
    - "No cross-user leakage."
  safety:
    - "Prompt injection cannot override policy."
    - "Tool arguments are validated."
    - "No unauthorized actions."
    - "No hidden prompt or secret leakage."
  product_integrity:
    - "Canonical PulseSOC IDs remain authoritative."
    - "No duplicate backends or records."
    - "Native and WebView share canonical UNDX history."
  quality:
    - "Evaluation gates pass."
    - "Xcode simulator QA passes."
    - "Physical iPhone 16 Pro QA passes."
    - "Performance is measured."
    - "No unverified claims."
  delivery:
    - "Changes are committed."
    - "Push is confirmed."
